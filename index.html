<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Aneliswa Biz Hub | Empowering Local Entrepreneurs</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #0d0d0d;
            --white: #ffffff;
            --green: #06C167;
            --green-dark: #049a52;
            --green-faint: #e8fbf1;
            --warm: #FF6B35;
            --warm-light: #fff3ee;
            --grey-100: #f6f6f6;
            --grey-200: #ebebeb;
            --grey-400: #a0a0a0;
            --grey-600: #484848;
            --grey-800: #1c1c1c;
            --card-radius: 16px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.07);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.11);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.14);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--grey-100);
            color: var(--black);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--black);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--green);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.3px;
        }

        .logo-sub {
            font-size: 0.6rem;
            color: var(--grey-400);
            display: block;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #1e1e1e;
            border-radius: 100px;
            padding: 0 16px;
            gap: 10px;
            flex: 1;
            max-width: 400px;
            margin: 0 24px;
            border: 1.5px solid #2e2e2e;
            transition: border-color 0.2s;
        }

        .search-bar:focus-within { border-color: var(--green); }

        .search-bar i { color: var(--grey-400); font-size: 14px; }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            width: 100%;
            padding: 10px 0;
        }

        .search-bar input::placeholder { color: var(--grey-400); }

        .search-bar button {
            background: var(--green);
            border: none;
            color: var(--black);
            font-weight: 700;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 100px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .search-bar button:hover { background: var(--green-dark); }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 100px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .nav-btn:hover { background: rgba(255,255,255,0.08); }

        .cart-btn {
            background: var(--green);
            color: var(--black);
            font-weight: 700;
            border-radius: 100px;
            padding: 8px 18px;
            position: relative;
        }

        .cart-btn:hover { background: var(--green-dark); color: var(--white); }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--warm);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── HERO ── */
        .hero {
            background: var(--black);
            padding: 64px 24px 56px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(6,193,103,0.18) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: 30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,107,53,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-inner {
            max-width: 680px;
            position: relative;
            z-index: 1;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6,193,103,0.15);
            border: 1px solid rgba(6,193,103,0.3);
            color: var(--green);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 100px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--white);
            line-height: 1.15;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .hero h1 em {
            font-style: normal;
            color: var(--green);
        }

        .hero p {
            color: var(--grey-400);
            font-size: 1rem;
            max-width: 500px;
            margin-bottom: 32px;
        }

        .hero-stats {
            display: flex;
            gap: 32px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat strong {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--white);
        }

        .stat span {
            font-size: 0.75rem;
            color: var(--grey-400);
        }

        /* ── CATEGORY PILLS ── */
        .cat-section {
            background: var(--white);
            padding: 0 24px;
            border-bottom: 1px solid var(--grey-200);
            position: sticky;
            top: 64px;
            z-index: 100;
        }

        .cat-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 14px 0;
            scrollbar-width: none;
        }

        .cat-scroll::-webkit-scrollbar { display: none; }

        .cat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--grey-100);
            border: 1.5px solid var(--grey-200);
            border-radius: 100px;
            padding: 7px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s;
            color: var(--grey-600);
        }

        .cat-pill:hover { border-color: var(--black); color: var(--black); }

        .cat-pill.active {
            background: var(--black);
            border-color: var(--black);
            color: var(--white);
        }

        /* ── MAIN CONTENT ── */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--black);
        }

        .section-count {
            font-size: 0.8rem;
            color: var(--grey-400);
            font-weight: 500;
        }

        /* ── PRODUCT GRID ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        /* ── PRODUCT CARD ── */
        .product-card {
            background: var(--white);
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.22s ease;
            cursor: pointer;
            border: 1.5px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--grey-200);
        }

        .product-img-wrap {
            position: relative;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img { transform: scale(1.04); }

        .featured-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--warm);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-info {
            padding: 14px;
        }

        .product-vendor {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--green-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .product-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--black);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-location {
            font-size: 0.68rem;
            color: var(--grey-400);
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 10px;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--black);
        }

        .add-btn {
            background: var(--black);
            border: none;
            border-radius: 100px;
            padding: 8px 14px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.18s;
        }

        .add-btn:hover { background: var(--green); color: var(--black); }

        /* ── CART SIDEBAR ── */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -440px;
            width: 420px;
            height: 100%;
            background: var(--white);
            z-index: 500;
            transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }

        .cart-sidebar.open { right: 0; }

        .cart-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--grey-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .close-cart {
            background: var(--grey-100);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-cart:hover { background: var(--grey-200); }

        .cart-items { flex: 1; overflow-y: auto; padding: 16px 24px; }

        .cart-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--grey-100);
            align-items: flex-start;
        }

        .cart-item-img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .cart-item-details { flex: 1; }
        .cart-item-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }
        .cart-item-vendor { font-size: 0.65rem; color: var(--green-dark); font-weight: 600; text-transform: uppercase; }
        .cart-item-price { font-size: 0.82rem; font-weight: 700; margin-top: 6px; color: var(--grey-600); }

        .cart-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .cart-qty button {
            background: var(--grey-100);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: background 0.15s;
        }

        .cart-qty button:hover { background: var(--grey-200); }

        .cart-qty span { font-weight: 700; font-size: 0.9rem; min-width: 18px; text-align: center; }

        .remove-item {
            background: none;
            border: none;
            color: var(--grey-400);
            cursor: pointer;
            font-size: 0.7rem;
            text-decoration: underline;
            margin-left: 6px;
        }

        .remove-item:hover { color: #e53e3e; }

        .cart-footer {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--grey-200);
            background: var(--grey-100);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--grey-600);
        }

        .total-final {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--black);
        }

        .checkout-btn {
            background: var(--green);
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--black);
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .checkout-btn:hover { background: var(--green-dark); color: var(--white); }

        /* ── OVERLAY ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 400;
            display: none;
        }

        .overlay.active { display: block; }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 600;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--white);
            border-radius: 20px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: var(--shadow-lg);
        }

        .modal-content h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* ── FORMS ── */
        .form-group { margin-bottom: 14px; }

        .form-group label {
            font-size: 0.72rem;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--grey-600);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--grey-200);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            background: var(--white);
            transition: border-color 0.2s;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { border-color: var(--black); }

        /* ── BUTTONS ── */
        .btn-primary {
            background: var(--black);
            color: var(--white);
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--green); color: var(--black); }

        .btn-secondary {
            background: var(--grey-200);
            color: var(--grey-800);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-secondary:hover { background: var(--grey-400); color: var(--white); }
